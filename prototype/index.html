<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ lý khiếu nại · Lab T4</title>
  <style>
    :root { color-scheme: light; --ink: #172e2b; --muted: #526661; --line: #dce5df; --green: #155346; --paper: #f4f6f2; --cream: #fff4da; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 "Inter", "Segoe UI", sans-serif; }
    header { background: #102d27; color: white; }
    .bar, .layout { max-width: 1240px; margin: auto; padding-inline: 32px; }
    .bar { min-height: 74px; display: flex; gap: 13px; align-items: center; }
    .brand-icon { background: #d4edb4; color: #19392f; font-size: 21px; font-weight: 700; border-radius: 10px; padding: 4px 11px; }
    .brand strong, .brand span { display: block; }
    .brand span { color: #bed5c9; font-size: 12px; }
    .bar .mode { margin-left: auto; color: #e2f1e9; border: 1px solid #557369; border-radius: 30px; padding: 4px 12px; font-size: 12px; }
    .layout { display: grid; grid-template-columns: 275px minmax(0, 1fr); gap: 38px; padding-block: 38px 56px; }
    aside { align-self: start; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(24px, 4vw, 35px); line-height: 1.1; letter-spacing: -.04em; margin: 5px 0 7px; }
    h2 { font-size: 20px; line-height: 1.3; letter-spacing: -.02em; }
    h3 { font-size: 15px; }
    p + p { margin-top: 8px; }
    .label { color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .muted, small { color: var(--muted); }
    .case-list { display: grid; gap: 8px; margin: 15px 0 22px; }
    button { font: inherit; cursor: pointer; border-radius: 9px; }
    button:focus-visible { outline: 3px solid #126d83; outline-offset: 3px; }
    .case { text-align: left; background: white; border: 1px solid var(--line); color: var(--ink); padding: 12px 13px; width: 100%; }
    .case strong, .case small { display: block; }
    .case[aria-pressed="true"] { background: #e7efe3; border-color: #599175; box-shadow: inset 3px 0 #2f765b; }
    .order { border-block: 1px solid var(--line); padding-block: 16px; }
    .order h3 { margin: 4px 0; }
    .order p { font-size: 13px; }
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px; background: white; }
    .card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 13px; }
    .card-title { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .pill, .marker { display: inline-flex; align-items: center; border-radius: 99px; font-weight: 650; }
    .pill { padding: 2px 9px; background: #e7f0e7; color: #215347; font-size: 12px; }
    .pill.warning { background: var(--cream); color: #734d00; }
    .marker { width: 23px; height: 23px; justify-content: center; background: var(--green); color: white; font-size: 12px; flex: 0 0 auto; }
    .sources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .source { background: #f5f7f3; border-radius: 9px; padding: 12px; }
    .source.missing { background: var(--cream); }
    .source p { margin-top: 4px; }
    .evidence { margin-top: 11px; }
    .actions, .tabs { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    .actions { margin-top: 14px; }
    .action, .tab { font-weight: 650; padding: 8px 12px; border: 1px solid #a9bdb3; background: white; color: var(--green); }
    .primary, .tab[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: white; }
    button:hover:not(:disabled) { filter: brightness(.96); }
    button:disabled { opacity: .62; cursor: default; }
    .workspace { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 17px; background: white; }
    .tabs { gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); background: white; }
    .tab { border: 0; border-radius: 0; color: var(--muted); background: white; padding: 10px 13px; border-bottom: 3px solid transparent; }
    .tab[aria-pressed="true"] { background: white; color: var(--green); border-bottom-color: var(--green); }
    .conversation, .workflow { padding: 21px 24px; background: #f7f9f6; }
    .conversation { display: grid; gap: 15px; }
    .chat-row { display: flex; align-items: flex-start; gap: 9px; }
    .chat-row.person { justify-content: flex-end; }
    .chat-avatar { width: 30px; height: 30px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 9px; background: #dcebe2; color: var(--green); font-size: 11px; font-weight: 800; }
    .chat-bubble { max-width: min(88%, 670px); min-width: 0; border: 1px solid var(--line); border-radius: 4px 15px 15px; background: white; padding: 10px 13px; overflow-wrap: anywhere; }
    .chat-bubble p { white-space: pre-wrap; }
    .chat-row.person .chat-bubble { border-radius: 15px 4px 15px 15px; background: #e6f0e5; border-color: #d9e7d9; }
    .chat-byline { display: block; margin-bottom: 3px; color: var(--green); font-weight: 700; font-size: 12px; }
    .chat-card { margin: 0 0 0 39px; }
    .chat-card > summary { cursor: pointer; font-weight: 650; color: var(--green); }
    .chat-card .card { margin: 10px 0 0; }
    .chat-controls { margin-left: 39px; }
    .chat-controls .actions { margin-top: 0; }
    .composer { display: grid; gap: 5px; padding: 14px 24px; border-top: 1px solid var(--line); }
    .composer-row { display: flex; gap: 8px; }
    .composer input { min-width: 0; width: 100%; border: 1px solid #a9bdb3; border-radius: 9px; padding: 8px 11px; font: inherit; color: var(--ink); }
    .composer input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    .workflow .notice:first-child { margin-top: 0; }
    .flow { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
    .flow li { display: flex; align-items: flex-start; gap: 10px; }
    .flow li .pill { margin-left: auto; flex-shrink: 0; }
    .tool-list { margin: 9px 0 0; padding-left: 19px; }
    .notice { padding: 12px 14px; background: #e8f1e6; border-radius: 9px; margin-top: 12px; }
    .notice.warning { background: var(--cream); }
    .facts { padding-left: 18px; margin: 8px 0 0; }
    .confirm { border: 1px solid #caa757; background: #fffaf0; border-radius: 9px; padding: 14px; margin-top: 14px; }
    .status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    @media (max-width: 780px) {
      .bar, .layout { padding-inline: 17px; }
      .layout { grid-template-columns: 1fr; gap: 24px; padding-top: 23px; }
      .case-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .case-list, .sources { grid-template-columns: 1fr; }
      .card, .hero, .conversation, .workflow, .composer { padding: 14px; }
      .tabs { padding-inline: 6px; }
      .tab { padding-inline: 8px; }
      .chat-card, .chat-controls { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <span class="brand-icon" aria-hidden="true">↗</span>
      <div class="brand"><strong>Trợ lý khiếu nại</strong><span>Hàng nhận không đúng mô tả</span></div>
      <span class="mode">Lab T4 · Dữ liệu giả</span>
    </div>
  </header>
  <div class="layout">
    <aside aria-label="Kịch bản và thông tin đơn">
      <p class="label">Chọn kịch bản</p>
      <div class="case-list" id="cases"></div>
      <div class="order" id="order"></div>
      <div class="actions"><button class="action" data-action="reset">Bắt đầu lại ca này</button></div>
    </aside>
    <main id="screen"></main>
  </div>
  <div class="status" id="announcement" role="status"></div>

  <script type="application/json" id="scenario-data">
{
  "match": {
    "title": "Tem khớp với mô tả",
    "detail": "Người bán có căn cứ phản hồi",
    "id": "T4-1088",
    "item": "Áo thun Basic · Size L",
    "amount": "249.000 ₫",
    "complaint": "Áo có tem L mà mình mặc chật. Hoàn tiền luôn đi, không thì mình đăng bài bóc phốt.",
    "original": "Size L, ngang ngực áo 54 cm (đo khi trải phẳng).",
    "current": "Size L, ngang ngực áo 54 cm (đo khi trải phẳng).",
    "evidence": "Ảnh của người mua cho thấy tem size L. Chưa có ảnh đo ngang ngực áo.",
    "extra": "Ảnh người mua đo ngang ngực áo 54 cm khi trải phẳng.",
    "assistant": "Tem size L khớp với đơn. Mình chưa đủ căn cứ xác định áo sai kích thước mô tả. Bạn có thể bổ sung ảnh đo ngang ngực áo để nhân viên đối chiếu.",
    "reply": "Shop gửi ảnh tem L và ảnh đo ngang ngực áo 54 cm, khớp bảng kích thước lúc đặt.",
    "reviewer": "Tem và số đo của hai bên khớp bản mô tả lúc đặt. Có căn cứ để nhân viên kết luận hàng đúng mô tả.",
    "decision": "dismiss"
  },
  "wrong": {
    "title": "Shop nhận gửi nhầm đồ",
    "detail": "Ca có bằng chứng rõ",
    "id": "T4-1116",
    "item": "Áo sơ mi Linen · Size L",
    "amount": "389.000 ₫",
    "complaint": "Mình đặt L nhưng nhận M. Shop nhắn nhận gửi nhầm rồi. Giờ trả hàng thế nào?",
    "original": "Biến thể đã đặt: size L.",
    "current": "Sản phẩm có các size M và L.",
    "evidence": "Ảnh của người mua cho thấy tem size M. Shop đã nhắn xác nhận gửi nhầm.",
    "extra": "",
    "assistant": "Đơn ghi size L, ảnh tem ghi size M và shop đã xác nhận gửi nhầm. Mình đã chuẩn bị bản nháp yêu cầu trả hàng để bạn kiểm tra và gửi.",
    "reply": "Shop xác nhận gửi size M cho đơn size L và đồng ý nhận lại hàng.",
    "reviewer": "Đơn đặt size L, tem ghi size M và shop đã xác nhận gửi nhầm. Có căn cứ để nhân viên duyệt hoàn tiền trong mô phỏng.",
    "decision": "refund"
  },
  "counterfeit": {
    "title": "Nghi hàng giả, đòi khóa shop",
    "detail": "Chuyển bộ phận chuyên trách",
    "id": "T4-1152",
    "item": "Tai nghe SoundLite",
    "amount": "590.000 ₫",
    "complaint": "Logo trên hộp nhìn khác hình lúc mua. Chắc hàng giả rồi, khóa shop ngay cho tôi!",
    "original": "Tai nghe SoundLite, màu đen, kèm hộp và cáp sạc.",
    "evidence": "Người mua mô tả logo trên hộp trông khác hình. Chưa có kết quả xác minh nguồn gốc.",
    "assistant": "Logo khác hình chưa đủ để kết luận hàng giả. Mình có thể hướng dẫn bạn gửi báo cáo cho bộ phận chuyên trách xác minh. Việc khóa shop thuộc thẩm quyền của bộ phận xử lý vi phạm.",
    "route": "specialist"
  }
}
  </script>

  <script>
    const scenarios = JSON.parse(document.querySelector('#scenario-data').textContent);

    const cases = document.querySelector('#cases');
    const order = document.querySelector('#order');
    const screen = document.querySelector('#screen');
    const announcement = document.querySelector('#announcement');
    const deadline = '17:00 ngày 14/11/2026';
    const views = [['buyer', 'Khách hàng (người mua)'], ['seller', 'Người bán'], ['workflow', 'Luồng xử lý AI'], ['staff', 'Nhân viên']];
    const liveChat = location.protocol !== 'file:';
    let state;

    function reset(id) {
      state = {
        id, view: 'buyer', submitted: false, evidenceAdded: false, draft: id === 'wrong',
        replied: false, confirming: false, outcome: '', analysis: null,
        messages: { buyer: [], seller: [] }, drafts: { buyer: '', seller: '' },
      };
    }

    function button(action, label, options = {}) {
      const { primary = false, disabled = false } = options;
      return `<button class="action${primary ? ' primary' : ''}" data-action="${action}" ${disabled ? 'disabled' : ''}>${label}</button>`;
    }

    function heading(number, title, badge = '') {
      return `<div class="card-title"><span class="marker" aria-hidden="true">${number}</span><h2>${title}</h2>${badge}</div>`;
    }

    function escapeText(value) {
      const element = document.createElement('span');
      element.textContent = value;
      return element.innerHTML;
    }

    function bubble(name, text, person = false) {
      return `<div class="chat-row${person ? ' person' : ''}">
        ${person ? '' : '<span class="chat-avatar" aria-hidden="true">AI</span>'}
        <div class="chat-bubble"><span class="chat-byline">${escapeText(name)}</span><p>${escapeText(text)}</p></div>
      </div>`;
    }

    function chat(role, initialMessages, controls = '') {
      const name = role === 'buyer' ? 'Bạn · Người mua' : 'Bạn · Người bán';
      const messages = state.messages[role];
      const pending = messages.at(-1)?.pending;
      const transcript = messages.map(({ text, reply, model }) => bubble(name, text, true)
        + (reply ? bubble(model ? `Trợ lý AI · ${model}` : 'Trợ lý · Mô phỏng', reply) : '')).join('');
      const example = role === 'buyer' ? 'Ví dụ: Tôi cần gửi ảnh gì?' : 'Ví dụ: Shop cần cung cấp bằng chứng gì?';
      return `<section class="conversation" aria-label="Tin nhắn">
        ${initialMessages}${transcript}
        ${pending ? bubble('Trợ lý AI', 'Đang xem hồ sơ và soạn câu trả lời…') : ''}
        ${controls}
      </section>
      <form class="composer" id="composer" data-role="${role}">
        <div class="composer-row">
          <input name="message" aria-label="Tin nhắn về hồ sơ mẫu" placeholder="${example}" maxlength="300" required autocomplete="off">
          <button class="action primary" type="submit" ${pending ? 'disabled' : ''}>Gửi</button>
        </div>
        <small>${liveChat ? 'Tin nhắn được gửi tới model. Chỉ nhập thông tin giả dùng cho demo.' : 'Đang mở bản mô phỏng cục bộ. Tin nhắn chỉ hiển thị trong demo.'}</small>
      </form>`;
    }

    function evidenceCard(scenario) {
      return `<section class="card">
        ${heading(1, 'Căn cứ đối chiếu', scenario.original ? '' : '<span class="pill warning">Thiếu bản lưu</span>')}
        <div class="sources">
          <div class="source${scenario.original ? '' : ' missing'}"><h3>Mô tả lúc đặt</h3><small>Bản lưu gắn với đơn ${scenario.id}</small><p>${scenario.original || 'Chưa tìm thấy bản lưu cho đơn này.'}</p></div>
          <div class="source"><h3>Mô tả hiện tại</h3><small>Trang sản phẩm đang hiển thị</small><p>${scenario.current}</p></div>
        </div>
        <p class="evidence"><strong>Bằng chứng đã có.</strong> ${scenario.evidence}</p>
        ${state.evidenceAdded ? `<p><strong>Ảnh bổ sung.</strong> ${scenario.extra}</p>` : ''}
      </section>`;
    }

    function comparisonPanel() {
      const analysis = state.analysis;
      const pending = analysis?.status === 'pending';
      if (location.protocol === 'file:') {
        return '<p class="notice">Đang mở bản mô phỏng. Để dùng model, chạy máy chủ cục bộ rồi mở http://127.0.0.1:4174/.</p>';
      }
      return `<div class="notice" aria-live="polite">
        <h3>Đối chiếu bằng LLM</h3>
        <p>${pending ? 'Đang kiểm tra bằng chứng với model…' : 'Model phân tích dữ liệu mẫu và đưa nhận định để tham khảo.'}</p>
        ${analysis && !pending ? '<p id="llm-result"></p>' : ''}
        <div class="actions">${button('compare', 'Đối chiếu bằng LLM', { disabled: pending })}</div>
      </div>`;
    }

    async function compareWithModel() {
      const pending = { status: 'pending' };
      state.analysis = pending;
      render();
      let text;
      try {
        const response = await fetch('/api/compare', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: state.id, evidenceAdded: state.evidenceAdded }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error);
        const findings = { insufficient: 'Chưa đủ căn cứ', match: 'Bằng chứng khớp', mismatch: 'Có sai khác' };
        text = `${findings[result.finding]} · ${result.reason} (${result.model})`;
      } catch (error) {
        text = `Chưa có nhận định từ model. ${error.message}`;
      }
      if (state.analysis !== pending) return;
      state.analysis = { text };
      render();
    }

    function renderBuyer(scenario) {
      if (scenario.route === 'specialist') return renderSpecialistChat(scenario);
      const initialActions = state.id === 'wrong'
        ? state.draft
          ? `${button('submit', 'Kiểm tra và gửi hồ sơ', { primary: true })}${button('undo-draft', 'Hoàn tác bản nháp')}`
          : button('make-draft', 'Tạo lại bản nháp', { primary: true })
        : button('transfer', state.evidenceAdded ? 'Gửi hồ sơ kèm ảnh' : 'Chuyển nhân viên', { primary: state.evidenceAdded });
      const canEditEvidence = scenario.extra && !state.outcome;
      const evidenceAction = canEditEvidence ? state.evidenceAdded
        ? button('remove-evidence', 'Gỡ ảnh bổ sung')
        : button('add-evidence', state.submitted ? 'Bổ sung ảnh mẫu' : 'Bổ sung ảnh mẫu và gửi hồ sơ', { primary: !state.submitted }) : '';
      const assistant = state.id === 'wrong' && !state.draft
        ? 'Đã hoàn tác bản nháp. Bạn có thể tạo lại yêu cầu trả hàng khi cần.' : scenario.assistant;
      const messages = bubble('Bạn · Người mua', scenario.complaint, true)
        + bubble('② Trợ lý AI · Hướng dẫn theo kịch bản', assistant)
        + (state.evidenceAdded ? bubble('Bạn · Người mua', scenario.extra, true) : '')
        + (state.analysis?.text ? bubble('Trợ lý AI · Đối chiếu bằng LLM', state.analysis.text) : '')
        + (state.submitted ? bubble('③ Trợ lý · Trạng thái hồ sơ', caseStatus()) : '');
      return chat('buyer', messages, `<details class="chat-card"><summary>Xem căn cứ đối chiếu</summary>${evidenceCard(scenario)}</details>
        <div class="chat-controls">
          ${!state.submitted && state.draft ? `<p class="notice">Bản nháp đơn ${scenario.id} · Gửi nhầm size · ${scenario.amount}</p>` : ''}
          <div class="actions">${evidenceAction}${state.submitted
            ? (!state.replied && state.id !== 'wrong' ? button('undo-transfer', 'Hoàn tác chuyển hồ sơ') : '')
            : initialActions}</div>
        </div>`);
    }

    function renderSpecialistChat(scenario) {
      const messages = bubble('Bạn · Người mua', scenario.complaint, true)
        + bubble('Trợ lý AI · Hướng dẫn theo kịch bản', scenario.assistant)
        + (state.submitted ? bubble('Trợ lý · Trạng thái báo cáo', caseStatus()) : '');
      let controls = '';
      if (!state.submitted) {
        controls = state.confirming ? `<div class="confirm">
          <h3>Xem lại báo cáo mẫu</h3>
          <p><strong>Đơn ${scenario.id}.</strong> ${scenario.evidence}</p>
          <p>Bộ phận chuyên trách sẽ xem báo cáo. Shop vẫn hoạt động trong lúc chờ xác minh.</p>
          <div class="actions">${button('send-report', 'Xác nhận gửi báo cáo', { primary: true })}${button('cancel', 'Quay lại')}</div>
        </div>` : button('preview-report', 'Xem báo cáo nghi hàng giả', { primary: true });
      }
      return chat('buyer', messages, `<div class="chat-controls">${controls}</div>`);
    }

    function outcomeCopy() {
      return {
        refund: 'Nhân viên đã duyệt hoàn tiền trong mô phỏng.',
        dismiss: 'Nhân viên đã đóng khiếu nại vì bằng chứng khớp mô tả lúc đặt.',
      }[state.outcome];
    }

    function renderSeller(scenario) {
      if (scenario.route === 'specialist') return chat('seller', bubble('Trợ lý · Thông báo', 'Shop chưa có yêu cầu phản hồi trong luồng khiếu nại này. Shop vẫn đang hoạt động.'));
      if (!state.submitted) return chat('seller', bubble('Trợ lý · Thông báo', 'Shop chưa nhận yêu cầu phản hồi. Hồ sơ sẽ xuất hiện ở đây sau khi người mua xác nhận gửi.'));
      const messages = bubble('Trợ lý · Yêu cầu phản hồi', `Đơn ${scenario.id} có khiếu nại hàng nhận không đúng mô tả. Vui lòng gửi mô tả lúc bán và bằng chứng về hàng đã giao trước ${deadline} (mô phỏng).`)
        + (state.replied ? bubble('Bạn · Người bán', scenario.reply, true) + bubble('Trợ lý · Thông báo', 'Đã nhận phản hồi. Nhân viên có thể xem bằng chứng của cả hai bên.') : '')
        + (state.outcome ? bubble('Trợ lý · Trạng thái hồ sơ', caseStatus()) : '');
      return chat('seller', messages, state.replied ? '' : `<div class="chat-controls">${button('reply', 'Gửi phản hồi mẫu', { primary: true })}</div>`);
    }

    function renderReviewer(scenario) {
      const canDecide = state.replied && (!scenario.extra || state.evidenceAdded);
      const decisionLabel = scenario.decision === 'refund' ? 'Duyệt hoàn tiền' : 'Đóng khiếu nại';
      const consequence = scenario.decision === 'refund'
        ? `Nếu xác nhận, ${scenario.amount} được hoàn cho người mua trong mô phỏng.`
        : `Nếu xác nhận, khiếu nại đóng và ${scenario.amount} được ghi nhận cho người bán trong mô phỏng.`;
      return `<section class="card">
        ${heading(4, 'Nhân viên xem xét', '<span class="pill">Cần người duyệt</span>')}
        <ul class="facts"><li><strong>Người mua:</strong> ${scenario.complaint}</li><li><strong>Người bán:</strong> ${state.replied ? scenario.reply : `Chờ phản hồi đến ${deadline}.`}</li></ul>
        ${state.outcome ? `<p class="notice">${outcomeCopy()}</p>` : ''}
        ${!state.outcome && state.replied && state.id === 'match' && !state.evidenceAdded ? '<p class="notice warning">Cần thêm ảnh đo từ người mua trước khi chốt hồ sơ.</p>' : ''}
        ${!state.outcome && canDecide ? `<p class="notice">${scenario.reviewer}</p>` : ''}
        ${!state.outcome && !state.confirming ? `<div class="actions">${button('review', decisionLabel, { primary: true, disabled: !canDecide })}</div>` : ''}
        ${state.confirming && canDecide && !state.outcome ? `<div class="confirm"><h3>Xác nhận quyết định</h3><p>${consequence}</p><div class="actions">${button('confirm', 'Xác nhận', { primary: true })}${button('cancel', 'Quay lại')}</div></div>` : ''}
      </section>`;
    }

    function caseStatus() {
      if (scenarios[state.id].route === 'specialist') {
        return state.submitted ? 'Bộ phận chuyên trách đã nhận báo cáo. Nguồn gốc sản phẩm đang chờ xác minh.' : 'Chờ người mua xác nhận gửi báo cáo.';
      }
      if (state.outcome) return outcomeCopy();
      if (state.replied) return 'Đã nhận phản hồi của shop. Hồ sơ chờ nhân viên xem xét.';
      return state.submitted ? `Hồ sơ đã tiếp nhận. Shop có thể phản hồi đến ${deadline}.` : 'Chờ người mua gửi hồ sơ.';
    }

    function renderWorkflow(scenario) {
      if (scenario.route === 'specialist') return `<div class="workflow"><section class="card">
        <div class="card-title"><h2>Luồng báo cáo nghi hàng giả</h2><span class="pill warning">Ngoài thẩm quyền của AI</span></div>
        <ol class="flow">
          <li><span class="marker" aria-hidden="true">1</span><strong>Tiếp nhận nghi vấn</strong><span class="pill">Chưa xác minh</span></li>
          <li><span class="marker" aria-hidden="true">2</span><strong>Người mua duyệt nội dung</strong><span class="pill">${state.submitted ? 'Đã xác nhận gửi' : 'Chờ xác nhận'}</span></li>
          <li><span class="marker" aria-hidden="true">3</span><strong>Bộ phận chuyên trách xem xét</strong><span class="pill">${state.submitted ? 'Chờ xác minh' : 'Chưa nhận báo cáo'}</span></li>
        </ol>
        <p class="notice">AI chỉ hướng dẫn gửi báo cáo. Việc xác minh hàng giả và xử lý vi phạm thuộc bộ phận chuyên trách.</p>
      </section></div>`;
      const steps = [
        ['Đối chiếu dữ liệu mẫu', scenario.original ? 'Có bản mô tả lúc đặt' : 'Thiếu bản mô tả lúc đặt'],
        ['Hướng dẫn người mua', state.draft ? 'Đã chuẩn bị bản nháp' : state.evidenceAdded ? 'Đã bổ sung ảnh' : state.id === 'wrong' ? 'Bản nháp đã hoàn tác' : 'Đề xuất bước tiếp theo'],
        ['Nhận hồ sơ và phản hồi', state.replied ? 'Shop đã phản hồi' : state.submitted ? 'Chờ shop phản hồi' : 'Chờ người mua gửi'],
        ['Nhân viên xem xét', state.outcome ? 'Đã xác nhận' : state.replied ? 'Chờ nhân viên' : 'Chưa đến bước này'],
      ];
      return `<div class="workflow">
        <section class="card">
          <div class="card-title"><h2>Tiến trình hồ sơ</h2></div>
          <ol class="flow">${steps.map(([title, status], index) => `<li><span class="marker" aria-hidden="true">${index + 1}</span><strong>${title}</strong><span class="pill">${status}</span></li>`).join('')}</ol>
        </section>
        ${evidenceCard(scenario)}
        <section class="card">${comparisonPanel()}</section>
        <section class="card">
          <details><summary><strong>Quyền thao tác trong demo</strong></summary>
            <ul class="tool-list">
              <li><strong>AI tự làm:</strong> đối chiếu, hỏi thêm bằng chứng và soạn bản nháp có thể hoàn tác.</li>
              <li><strong>Người mua xác nhận:</strong> gửi hoặc chuyển hồ sơ cho nhân viên.</li>
              <li><strong>Nhân viên duyệt:</strong> hoàn tiền hoặc đóng khiếu nại trong tab Nhân viên.</li>
              <li><strong>Cấm AI:</strong> phạt hoặc khóa shop.</li>
            </ul>
          </details>
        </section>
      </div>`;
    }

    function renderStaff(scenario) {
      if (scenario.route === 'specialist') return `<div class="workflow"><section class="card">
        <div class="card-title"><h2>Báo cáo chuyển chuyên trách</h2><span class="pill">${state.submitted ? 'Chờ xác minh' : 'Chưa gửi'}</span></div>
        <p>${caseStatus()}</p>
        ${state.submitted ? `<p><strong>Đơn ${scenario.id}.</strong> ${scenario.evidence}</p>` : ''}
      </section></div>`;
      if (!state.submitted) return `<div class="workflow"><section class="card">
        <h2>Chưa có hồ sơ cần xem</h2><p>${caseStatus()}</p>
      </section></div>`;
      return `<div class="workflow">${renderReviewer(scenario)}${evidenceCard(scenario)}</div>`;
    }

    function render() {
      const scenario = scenarios[state.id];
      cases.innerHTML = Object.entries(scenarios).map(([id, value]) => `<button class="case" data-case="${id}" aria-pressed="${id === state.id}"><strong>${value.title}</strong><small>${value.detail}</small></button>`).join('');
      order.innerHTML = `<p class="label">Đơn ${scenario.id}</p><h3>${scenario.item}</h3><p>${scenario.amount} · Đã nhận hàng</p>`;
      const renderView = { buyer: renderBuyer, seller: renderSeller, workflow: renderWorkflow, staff: renderStaff }[state.view];
      const status = scenario.route === 'specialist' ? (state.submitted ? 'Đã chuyển chuyên trách' : 'Chưa gửi báo cáo')
        : state.outcome ? 'Đã có kết quả' : state.submitted ? 'Đang xử lý' : 'Chưa gửi hồ sơ';
      screen.innerHTML = `<div class="workspace">
        <div class="hero"><div><p class="label">Đơn ${scenario.id}</p><h1 id="screen-title" tabindex="-1">${scenario.title}</h1></div><span class="pill">${status}</span></div>
        <nav class="tabs" aria-label="Màn hình demo">${views.map(([view, label]) => `<button class="tab" data-action="${view}" aria-pressed="${state.view === view}">${label}</button>`).join('')}</nav>
        ${renderView(scenario)}
      </div>`;
      const input = screen.querySelector('#composer input');
      if (input) input.value = state.drafts[state.view];
      const result = document.querySelector('#llm-result');
      if (result) result.textContent = state.analysis.text;
    }

    function replyToMessage(role, message) {
      const topic = message.toLocaleLowerCase('vi');
      const scenario = scenarios[state.id];
      if (scenario.route === 'specialist') {
        if (role === 'seller') return 'Shop chưa có yêu cầu phản hồi trong luồng khiếu nại này.';
        return state.submitted ? caseStatus() : scenario.assistant;
      }
      if (role === 'seller') {
        if (!state.submitted || state.replied) return caseStatus();
        return `Shop có thể gửi mô tả lúc bán và bằng chứng trước ${deadline}. Bấm “Gửi phản hồi mẫu” để ghi nhận vào hồ sơ demo.`;
      }
      if (/trạng thái|đến đâu|bao lâu|hạn/.test(topic)) return caseStatus();
      if (/hoàn tiền|đóng khiếu nại|phạt|khóa/.test(topic)) return 'Nhân viên xem bằng chứng của hai bên trước khi quyết định hoàn tiền hoặc đóng khiếu nại. Việc phạt shop nằm ngoài luồng này.';
      if (state.submitted) return caseStatus();
      return scenario.assistant;
    }

    screen.addEventListener('input', (event) => {
      if (event.target.name === 'message') state.drafts[state.view] = event.target.value;
    });

    screen.addEventListener('submit', async (event) => {
      if (event.target.id !== 'composer') return;
      event.preventDefault();
      const role = event.target.dataset.role;
      const text = event.target.elements.message.value.trim();
      const conversation = state;
      const turns = state.messages[role];
      if (!text || turns.at(-1)?.pending) return;
      const history = turns.filter(turn => turn.model).slice(-3).map(({ text, reply }) => ({ text, reply }));
      const turn = { text, pending: liveChat };
      turns.push(turn);
      state.drafts[role] = '';
      if (!liveChat) turn.reply = replyToMessage(role, text);
      render();
      screen.querySelector('#composer input').focus();
      if (liveChat) {
        const { id, evidenceAdded, submitted, replied, draft, outcome } = state;
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, evidenceAdded, submitted, replied, draft, outcome, role, message: text, history }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error);
          turn.reply = result.reply;
          turn.model = result.model;
        } catch (error) {
          if (state !== conversation) return;
          turn.reply = `Chưa kết nối được với model. ${replyToMessage(role, text)}`;
        }
        turn.pending = false;
        if (state !== conversation || state.view !== role) return;
        const keepFocus = document.activeElement === screen.querySelector('#composer input');
        render();
        if (keepFocus) screen.querySelector('#composer input').focus();
      }
      announcement.textContent = turn.reply;
    });

    document.addEventListener('click', (event) => {
      const control = event.target.closest('button');
      if (!control) return;
      const scenario = scenarios[state.id];
      let update = '';
      if (control.dataset.case) {
        if (control.dataset.case === state.id) return;
        reset(control.dataset.case);
        update = 'Đã chọn ca khác.';
      } else {
        switch (control.dataset.action) {
          case 'reset': reset(state.id); update = 'Đã bắt đầu lại.'; break;
          case 'compare': compareWithModel(); return;
          case 'add-evidence':
            update = state.submitted ? 'Đã bổ sung ảnh vào hồ sơ.' : 'Đã gửi hồ sơ kèm ảnh mẫu cho nhân viên.';
            state.evidenceAdded = true;
            state.submitted = true;
            state.analysis = null;
            break;
          case 'remove-evidence': state.evidenceAdded = false; state.analysis = null; update = 'Đã gỡ ảnh bổ sung.'; break;
          case 'undo-draft': state.draft = false; update = 'Đã hoàn tác bản nháp.'; break;
          case 'make-draft': state.draft = true; update = 'Đã tạo bản nháp.'; break;
          case 'submit':
          case 'transfer': state.submitted = true; update = 'Hồ sơ đã tiếp nhận.'; break;
          case 'undo-transfer': state.submitted = false; update = 'Đã hoàn tác chuyển hồ sơ.'; break;
          case 'preview-report': state.confirming = true; break;
          case 'send-report': state.submitted = true; state.confirming = false; update = caseStatus(); break;
          case 'buyer':
          case 'seller':
          case 'staff':
          case 'workflow': state.view = control.dataset.action; state.confirming = false; break;
          case 'reply': state.replied = true; update = 'Shop đã gửi phản hồi.'; break;
          case 'review': state.confirming = true; break;
          case 'cancel': state.confirming = false; break;
          case 'confirm': state.outcome = scenario.decision; state.confirming = false; update = outcomeCopy(); break;
          default: return;
        }
      }
      render();
      announcement.textContent = update;
      const selected = [...document.querySelectorAll('button')].find((button) =>
        !button.disabled && (control.dataset.case ? button.dataset.case === control.dataset.case : button.dataset.action === control.dataset.action));
      (selected || document.querySelector('#screen-title')).focus({ preventScroll: true });
    });

    reset('match');
    render();
  </script>
</body>
</html>
